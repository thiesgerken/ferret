# Development only. The deployment is the Helm chart.
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,nosuid,nodev,mode=1777

services:
  server:
    <<: *hardened
    image: ghcr.io/thiesgerken/ferret:${FERRET_IMAGE_TAG:-latest}
    ports:
      # Host ports off the defaults (here and for ParadeDB), so ferret runs next to other
      # stacks that already hold 8080 and 5432.
      - "127.0.0.1:8380:8080"
    depends_on:
      paradedb:
        condition: service_healthy
    environment:
      FERRET_CONFIG_FILE: /etc/ferret/config.yaml
      FERRET_DATABASE_URL: postgres://ferret:ferret@paradedb:5432/ferret
      # Development values. Sign in as `admin` with the bootstrap password.
      FERRET_SESSION_SECRET: development session secret, not for production
      FERRET_BOOTSTRAP_PASSWORD: ferret-development
      FERRET_WORKER_SECRET: &worker-secret development worker secret, not for production
      # base64 of "development config key, not prod"
      FERRET_CONFIG_KEY: ZGV2ZWxvcG1lbnQgY29uZmlnIGtleSwgbm90IHByb2Q=
    volumes:
      - ./docker/ferret.yaml:/etc/ferret/config.yaml:ro

  plugins:
    <<: *hardened
    image: ghcr.io/thiesgerken/ferret-plugins:${FERRET_IMAGE_TAG:-latest}
    depends_on:
      - server
    environment:
      FERRET_INTERNAL_URL: http://server:8081
      FERRET_SERVER_URL: http://server:8080
      FERRET_WORKER_SECRET: *worker-secret

  frontend:
    <<: *hardened
    image: ghcr.io/thiesgerken/ferret-frontend:${FERRET_IMAGE_TAG:-latest}

  # The UI at http://127.0.0.1:3380, routed like the cluster's HTTPRoute (docker/traefik-dynamic.yml).
  proxy:
    image: traefik:v3.7@sha256:c8a121e4bb1347e8fd52657fab12f2cb70b68f8a018895e2068f92c9e519b9c2
    command:
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--entrypoints.web.address=:80"
    depends_on:
      - server
      - frontend
    ports:
      - "127.0.0.1:3380:80"
    volumes:
      - ./docker/traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro

  paradedb:
    image: paradedb/paradedb:v0.26.3-pg18@sha256:9b15fc383bcd771f1e32e222bd1603c4c29856c481f6bd06f1960e89608c02f0
    restart: unless-stopped
    environment:
      POSTGRES_DB: ferret
      POSTGRES_USER: ferret
      POSTGRES_PASSWORD: ferret
    ports:
      # For `cargo test` and `cargo run` on the host, see .cargo/config.toml.
      - "127.0.0.1:5439:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferret -d ferret"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Only for testing the IMAP plugin: a throwaway mailbox for its tests (see .cargo/config.toml),
  # and for trying the plugin by hand with server `dovecot:31143` without TLS, any user name,
  # password `pass`. Mails live only in the container. Scaled to 0 so a plain `docker compose up`
  # leaves it out, start it with `--scale dovecot=1`.
  dovecot:
    image: dovecot/dovecot:2.4.5@sha256:43c14def08a57f25107593cbcf64a0a6fbae84a7b9de7aa038513c9b21e91914
    deploy:
      replicas: 0
    environment:
      USER_PASSWORD: "{PLAIN}pass"
    ports:
      - "127.0.0.1:3143:31143"
    volumes:
      - ./docker/dovecot-test.conf:/etc/dovecot/conf.d/ferret-test.conf:ro

  # The embedding models' endpoints (docker/ferret.yaml): tei computes Qwen3 for queries and the
  # embed pump.
  tei: &tei
    # The ARM Compose overlay selects the native image and rejects x86 execution.
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4@sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d}
    restart: unless-stopped
    # The default batch budget (16k tokens) makes the warmup allocate attention for a 16k-token
    # sequence, which gets TEI OOM-killed in a typical Docker Desktop VM. 4096 still clears the
    # chunker's 2000-character cap (and caps TEI's max_input_length at 4096).
    command: ["--model-id", "Qwen/Qwen3-Embedding-0.6B", "--max-batch-tokens", "4096"]
    volumes:
      - tei-models:/data
    # /info, not /health: TEI answers /health on the same thread as the embedding batches, so it
    # times out while a backfill keeps TEI busy. /info answers from memory, and TEI only starts
    # listening once the model is loaded and warmed up.
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost/info"]
      interval: 5s
      timeout: 3s
      # The first start downloads the model.
      start_period: 10m

  # bge-m3, a second model. Off unless `docker compose up -d --scale tei-bge=1 tei-bge`: until
  # then its endpoint is unreachable, which Admin shows. Its model needs about 2 GB of memory more.
  tei-bge:
    <<: *tei
    command: ["--model-id", "BAAI/bge-m3", "--max-batch-tokens", "4096"]
    deploy:
      replicas: 0

volumes:
  pgdata:
  tei-models:
