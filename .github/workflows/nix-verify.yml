name: Nix verification

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-x64-${{ hashFiles('flake.lock', 'Cargo.lock', 'frontend/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-prefixes-first-match: nix-x64-
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Run every Linux check
        run: |
          test "$(uname -m)" = x86_64
          nix flake check --print-build-logs
      - name: Build all runtime packages and images
        run: |
          nix build --no-link --print-build-logs .#server .#plugins .#frontend
          nix build --out-link result-server-image --print-build-logs .#server-image
          nix build --out-link result-plugins-image --print-build-logs .#plugins-image
          nix build --out-link result-frontend-image --print-build-logs .#frontend-image
          mkdir -p dist
          cp -L result-server-image dist/server.tar.gz
          cp -L result-plugins-image dist/plugins.tar.gz
          cp -L result-frontend-image dist/frontend.tar.gz
          cp -R charts/ferret dist/chart
      - name: Exercise hardened runtime images
        run: |
          for archive in dist/*.tar.gz; do docker load --input "$archive"; done
          nix develop .#ci --command python scripts/smoke-images.py
          docker image inspect ferret:local ferret-plugins:local ferret-frontend:local \
            --format '{{.RepoTags}} {{.Architecture}} {{.Size}} bytes' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-x64-images
          path: dist/
          compression-level: 0
          retention-days: 3
