name: CI

on:
  pull_request:

jobs:
  rust-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check that frontend/schema.graphql matches the server's schema
        run: |
          cargo run --locked -q -p ferret-server -- schema > frontend/schema.graphql
          git diff --exit-code -- frontend/schema.graphql

  rust-test:
    runs-on: ubuntu-latest
    services:
      # Same image and credentials as docker-compose.yml, so .cargo/config.toml's DATABASE_URL
      # fits both.
      paradedb:
        image: paradedb/paradedb:0.26.2-pg18@sha256:c552094b6b68dcb0a4e7a3969963d801eaec02490db4d2dd032dcb096bc86cf8
        env:
          POSTGRES_DB: ferret
          POSTGRES_USER: ferret
          POSTGRES_PASSWORD: ferret
        ports:
          - 5439:5432
        options: >-
          --health-cmd "pg_isready -U ferret -d ferret"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - run: cargo test --workspace --locked
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: sqlx-cli@0.9.0
      # .sqlx is keyed by query text, so a migration that changes a column's type under an unchanged
      # query would otherwise keep compiling against stale types.
      - name: Check that .sqlx matches the migrated schema
        env:
          DATABASE_URL: postgres://ferret:ferret@localhost:5439/ferret
        run: |
          cargo sqlx migrate run --source crates/ferret-server/migrations
          cargo sqlx prepare --workspace --check

  docker-server:
    runs-on: ubuntu-latest
    needs: [rust-lint, rust-test]
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute short SHA
        id: vars
        run: echo "sha=$(echo '${{ github.event.pull_request.head.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: server
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ferret:pr${{ github.event.pull_request.number }}
            ghcr.io/${{ github.repository_owner }}/ferret:pr${{ github.event.pull_request.number }}-${{ steps.vars.outputs.sha }}
          # One scope per image, shared with the release builds, so images don't evict each other.
          cache-from: type=gha,scope=ferret
          cache-to: type=gha,scope=ferret,mode=max

  docker-plugins:
    runs-on: ubuntu-latest
    needs: [rust-lint, rust-test]
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute short SHA
        id: vars
        run: echo "sha=$(echo '${{ github.event.pull_request.head.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: plugins
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ferret-plugins:pr${{ github.event.pull_request.number }}
            ghcr.io/${{ github.repository_owner }}/ferret-plugins:pr${{ github.event.pull_request.number }}-${{ steps.vars.outputs.sha }}
          # One scope per image, shared with the release builds, so images don't evict each other.
          cache-from: type=gha,scope=ferret-plugins
          cache-to: type=gha,scope=ferret-plugins,mode=max

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Takes the pnpm version from packageManager.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend lint

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend test

  # The image build runs `next build`, which also typechecks.
  docker-frontend:
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-test]
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute short SHA
        id: vars
        run: echo "sha=$(echo '${{ github.event.pull_request.head.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ferret-frontend:pr${{ github.event.pull_request.number }}
            ghcr.io/${{ github.repository_owner }}/ferret-frontend:pr${{ github.event.pull_request.number }}-${{ steps.vars.outputs.sha }}
          # One scope per image, shared with the release builds, so images don't evict each other.
          cache-from: type=gha,scope=ferret-frontend
          cache-to: type=gha,scope=ferret-frontend,mode=max

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - run: helm lint charts/ferret --set ingress.hostname=ferret.example.com
      - run: helm template ferret charts/ferret --set ingress.hostname=ferret.example.com > /dev/null

  # A chart per PR that points at its images: <version>-pr.<N> follows the mutable :pr<N> tags,
  # <version>-pr.<N>.<sha> pins the immutable :pr<N>-<sha> ones (an ArgoCD pin then also re-pulls).
  helm-publish-pr:
    runs-on: ubuntu-latest
    needs: [helm-lint, docker-server, docker-plugins, docker-frontend]
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - name: Package PR Helm chart
        id: package
        run: |
          base_version=$(awk '/^version:/ { print $2; exit }' charts/ferret/Chart.yaml)
          pr_number='${{ github.event.pull_request.number }}'
          short_sha=$(echo '${{ github.event.pull_request.head.sha }}' | cut -c1-7)
          chart_version="${base_version}-pr.${pr_number}"
          chart_version_sha="${chart_version}.${short_sha}"

          mkdir -p dist
          helm package charts/ferret --destination dist \
            --version "$chart_version" --app-version "pr${pr_number}"
          helm package charts/ferret --destination dist \
            --version "$chart_version_sha" --app-version "pr${pr_number}-${short_sha}"

          echo "chart_version=$chart_version" >> "$GITHUB_OUTPUT"
          echo "chart_version_sha=$chart_version_sha" >> "$GITHUB_OUTPUT"
      - name: Push PR Helm chart to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin
          for version in "${{ steps.package.outputs.chart_version }}" "${{ steps.package.outputs.chart_version_sha }}"; do
            helm push "dist/ferret-${version}.tgz" oci://ghcr.io/${{ github.repository_owner }}/charts
          done
      - name: Summarize PR preview
        run: |
          {
            echo "## PR preview"
            echo
            echo "Images: \`ghcr.io/${{ github.repository_owner }}/{ferret,ferret-plugins,ferret-frontend}:pr${{ github.event.pull_request.number }}\`"
            echo
            echo "Chart: \`oci://ghcr.io/${{ github.repository_owner }}/charts/ferret\`"
            echo "- \`--version ${{ steps.package.outputs.chart_version }}\` follows the PR"
            echo "- \`--version ${{ steps.package.outputs.chart_version_sha }}\` pins this commit"
          } >> "$GITHUB_STEP_SUMMARY"
