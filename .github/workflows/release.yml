name: Release

# Only main releases. Integration branches merge into main as a whole.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # The tip of main, not the pushed commit: after back-to-back merges, the pushed commit is
      # already behind and semantic-release would refuse to push. The earlier run then releases
      # every merge and the later one finds nothing to release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: thiesgerken

      - name: Realize pinned version tools once
        run: |
          time nix build .#release-tools --out-link result-release-tools --print-build-logs
          echo "$PWD/result-release-tools/bin" >> "$GITHUB_PATH"
          echo "SSL_CERT_FILE=$PWD/result-release-tools/etc/ssl/certs/ca-bundle.crt" >> "$GITHUB_ENV"
          echo "UV_PYTHON=$PWD/result-release-tools/bin/python3.15" >> "$GITHUB_ENV"
      # Not the python-semantic-release action: it builds its image with an
      # unpinned `gitpython ~= 3.0`, and 3.1.60 dropped Actor.name_email_regex,
      # which psr 10.6.1 still uses. Drop the --with once psr releases a fix.
      - name: Semantic Release (version only)
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          uv tool run
          --from 'python-semantic-release==10.6.1'
          --with 'gitpython<3.1.60'
          semantic-release -c releaserc.toml -v version --no-vcs-release

  nix:
    needs: version
    if: needs.version.outputs.released == 'true'
    uses: ./.github/workflows/nix-verify.yml
    with:
      ref: v${{ needs.version.outputs.version }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  images:
    needs: [version, nix]
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ needs.version.outputs.version }}
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: thiesgerken
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-x64-images
          path: dist
      - name: Prepare pinned publishing tools
        run: |
          time nix build .#ci-tools --out-link result-ci-tools --print-build-logs
          echo "$PWD/result-ci-tools/bin" >> "$GITHUB_PATH"
          echo "SSL_CERT_FILE=$PWD/result-ci-tools/etc/ssl/certs/ca-bundle.crt" >> "$GITHUB_ENV"
      - name: Publish verified release images
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          export REGISTRY_AUTH_FILE="$RUNNER_TEMP/skopeo-auth.json"
          cleanup_auth() { rm -f "$REGISTRY_AUTH_FILE"; }
          trap cleanup_auth EXIT
          printf "%s" "$REGISTRY_TOKEN" | skopeo login --authfile "$REGISTRY_AUTH_FILE" --username "$REGISTRY_USER" --password-stdin ghcr.io
          bash scripts/publish-images.sh "$VERSION" latest

  publish:
    needs: [version, images]
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ needs.version.outputs.version }}

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: thiesgerken
      - name: Realize pinned publishing tools once
        run: |
          time nix build .#ci-tools --out-link result-ci-tools --print-build-logs
          echo "$PWD/result-ci-tools/bin" >> "$GITHUB_PATH"
          echo "SSL_CERT_FILE=$PWD/result-ci-tools/etc/ssl/certs/ca-bundle.crt" >> "$GITHUB_ENV"

      - name: Push Helm chart to GHCR
        run: |
          version="${{ needs.version.outputs.version }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin
          helm package charts/ferret --version "$version" --app-version "$version"
          helm push "ferret-${version}.tgz" oci://ghcr.io/${{ github.repository_owner }}/charts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ needs.version.outputs.version }}"
          owner="${{ github.repository_owner }}"

          # The latest changelog section
          notes=$(awk '/^## v'"${version}"'/{found=1; next} /^## v[0-9]/{if(found) exit} found' CHANGELOG.md)

          notes="${notes}

          ## Docker Images

          \`\`\`
          docker pull ghcr.io/${owner}/ferret:${version}
          docker pull ghcr.io/${owner}/ferret-plugins:${version}
          docker pull ghcr.io/${owner}/ferret-whatsapp-archive:${version}
          docker pull ghcr.io/${owner}/ferret-frontend:${version}
          \`\`\`

          ## Helm Chart

          \`\`\`
          helm install ferret oci://ghcr.io/${owner}/charts/ferret --version ${version}
          \`\`\`"

          gh release create "v${version}" \
            --repo "${{ github.repository }}" \
            --title "v${version}" \
            --notes "${notes}"
