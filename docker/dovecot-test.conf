# The IMAP plugin's tests log in without TLS: they reach Dovecot over the host's loopback, which
# Dovecot sees as a remote network. Any user name works, with the password `pass` (USER_PASSWORD
# in docker-compose.yml).
auth_allow_cleartext = yes

# A trash folder under another name, which the plugin must skip by its special use.
namespace inbox {
  mailbox Papierkorb {
    special_use = \Trash
  }
}
