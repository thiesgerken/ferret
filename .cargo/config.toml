[env]
# The development Compose ParadeDB. `#[sqlx::test]` creates a database per test in it.
# Nix checks override this with a disposable sandbox-local cluster.
DATABASE_URL = "postgres://ferret:ferret@localhost:5439/ferret"
# The development Compose Dovecot, scaled to zero until explicitly enabled. Each test uses its
# own mailbox. Nix checks override this with disposable sandbox-local Dovecot.
FERRET_TEST_IMAP = "localhost:3143"
# Queries are checked against the metadata in .sqlx, so building needs no database. After changing
# a query or a migration, regenerate it with `cargo sqlx prepare --workspace` (see AGENTS.md).
SQLX_OFFLINE = "true"
# ponytail: `#[sqlx::test]` pools share a budget of 20 connections, and each test (server plus test
# code) keeps 2-3 open. From 10 parallel tests on, dropping the test databases waits out a 30 s
# pool timeout. If tests ever need more connections each, lower this or give them smaller pools.
RUST_TEST_THREADS = "6"
# The bearer token an embedding endpoint's `token_env` names in the server tests. Set here because
# tests can't set environment variables safely while other tests run.
FERRET_TEST_EMBEDDING_TOKEN = "the endpoint's test token"
