# -- Server image (tag defaults to appVersion)
image:
  registry: ghcr.io
  repository: thiesgerken/ferret
  tag: ""
  pullPolicy: IfNotPresent

server:
  # -- Migrations run under an advisory lock, so several replicas may start together.
  replicas: 1
  # -- tracing filter, e.g. "info" or "ferret=debug,info"
  logLevel: info
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  # -- Extra environment variables for the server container
  extraEnv: []

# -- Embedding models for semantic search. With tei.internal.enabled, each gets its own CPU TEI
# Deployment. Any TEI of the pool (internal or externalTeis) works for whichever of these models
# it serves: the server asks every TEI for its model and matches `modelId`.
embedding:
  # -- The model searches use by default, one of the names below
  default: qwen3-embedding-0.6b
  models:
    # -- name: stored with every embedding, [a-z0-9][a-z0-9._-]*. Renaming a model re-embeds
    # everything under the new name.
    - name: qwen3-embedding-0.6b
      # -- Hugging Face model id: the internal TEI serves it, and a TEI reporting it in /info works
      # for this model. Two models can't share one.
      modelId: Qwen/Qwen3-Embedding-0.6B
      # -- Of the model's vectors. TEI doesn't report it: every answer is checked against it, and
      # the model's index is built for it.
      dimension: 1024
      queryPrefix: "Instruct: Given a search query, retrieve relevant passages from personal notes, documents and chats\nQuery: "
      documentPrefix: ""
      # -- Semantic candidates less similar to the query are dropped (cosine similarity, 0 to 1).
      # Model-specific, see embeddings.md for how to calibrate it.
      minSimilarity: 0.42
      # -- TEI's batch budget in tokens. TEI's own default (16384) gets its warmup OOM-killed on
      # small CPU nodes. It also caps the input length, which must stay at 2202 or more (title and
      # chunk, see embeddings.md).
      maxBatchTokens: 4096
      # -- Room for the downloaded model. A full cache evicts only this pod.
      cacheSize: 4Gi
      # -- The request is the RSS measured after warmup (1.93 GiB).
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          memory: 4Gi

tei:
  image:
    registry: ghcr.io
    repository: huggingface/text-embeddings-inference
    tag: "cpu-1.9.4@sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d"
    pullPolicy: IfNotPresent
  internal:
    # -- One CPU TEI per model in the cluster, which answers queries and embeds. Off only when
    # externalTeis serve every model.
    enabled: true

# -- TEIs outside this chart, as URLs, e.g. a laptop's GPU in the LAN for a backfill
# (`http://192.168.1.20:8080`) or a GPU TEI deployed separately. Each works for whichever
# configured model it serves, and starts with queries off: Admin switches each TEI on and off, for
# queries and for the embed pump. Remove one that's gone for good.
externalTeis: []

# -- Plugin workers: claim runs from the server's internal API and ingest through the public one.
plugins:
  image:
    registry: ghcr.io
    repository: thiesgerken/ferret-plugins
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 512Mi

# -- Restricts the server's internal port (8081) to the plugin workers. Needs a CNI that enforces
# NetworkPolicy; without one, the worker secret is the only protection.
networkPolicy:
  enabled: true

frontend:
  image:
    registry: ghcr.io
    repository: thiesgerken/ferret-frontend
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 64Mi

# -- Gateway API HTTPRoute: /graphql, /mcp, /api and /auth go to the server, everything else to the frontend.
ingress:
  enabled: true
  # -- Required when enabled, e.g. ferret.example.com
  hostname: ""
  # -- Gateway parent references (required when ingress is enabled)
  parentRefs:
    - name: default-gateway
  annotations: {}

# -- Generated once and kept across upgrades via `lookup`, or taken from existingSecret.
# WARNING: `lookup` only works under `helm install/upgrade`. Tools that render with
# `helm template` (Argo CD, Flux) get an empty lookup and would generate new values on every sync:
# a new Postgres password the initialized database doesn't know, and a new session secret that
# logs everyone out. Under GitOps, use existingSecret.
secrets:
  # -- Existing Secret with the keys postgres-password, bootstrap-password, session-secret,
  # worker-secret and config-key (see the chart's README).
  existingSecret: ""

# -- ParadeDB (Postgres with pg_search and pgvector), single instance with its own PVC. Backups are
# the cluster's job (CSI snapshots, e.g. Velero): put the PVC on a storage class that supports them.
postgres:
  image:
    registry: docker.io
    repository: paradedb/paradedb
    tag: "0.26.2-pg18@sha256:c552094b6b68dcb0a4e7a3969963d801eaec02490db4d2dd032dcb096bc86cf8"
    pullPolicy: IfNotPresent
  database: ferret
  username: ferret
  persistence:
    size: 20Gi
    # -- Leave empty to use the cluster default StorageClass
    storageClassName: ""
    # -- e.g. [kubernetes.io/pvc-protection] against accidental pruning
    finalizers: []
  # -- fsGroup so Postgres (uid 999) can write the data volume
  podSecurityContext:
    fsGroup: 999
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# -- Priority class for all pods
priorityClassName: ""
