apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-plugins
  labels:
    {{- include "ferret.labels" . | nindent 4 }}
    app.kubernetes.io/component: plugins
spec:
  replicas: {{ .Values.plugins.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "ferret.selectorLabels" (dict "root" . "component" "plugins") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ferret.selectorLabels" (dict "root" . "component" "plugins") | nindent 8 }}
    spec:
      # Runs read files from repositories they don't control; there's nothing in the Kubernetes API
      # a worker needs.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/arch: amd64
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
        - name: plugins
          image: {{ include "ferret.image" (dict "root" . "image" .Values.plugins.image) }}
          imagePullPolicy: {{ .Values.plugins.image.pullPolicy }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: FERRET_INTERNAL_URL
              value: "http://{{ .Release.Name }}-server:8081"
            - name: FERRET_SERVER_URL
              value: "http://{{ .Release.Name }}-server:8080"
            - name: FERRET_WORKER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "ferret.secretName" . }}
                  key: worker-secret
            - name: RUST_LOG
              value: {{ .Values.server.logLevel | quote }}
          {{- with .Values.plugins.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
