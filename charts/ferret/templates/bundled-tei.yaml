{{- /* A CPU TEI for the one model that sets bundledTei, for a quickstart. Real deployments name
their own endpoints. */}}
{{- if .Values.bundledTei.enabled }}
{{- $name := printf "%s-tei" .Release.Name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "ferret.labels" $ | nindent 4 }}
    app.kubernetes.io/component: tei
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "ferret.selectorLabels" (dict "root" $ "component" "tei") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ferret.selectorLabels" (dict "root" $ "component" "tei") | nindent 8 }}
    spec:
      {{- with $.Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      # TEI's images are amd64 only. arm64 CPU nodes need TEI's cpu-arm64 tag instead.
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: tei
          image: {{ include "ferret.image" (dict "root" $ "image" $.Values.bundledTei.image) }}
          imagePullPolicy: {{ $.Values.bundledTei.image.pullPolicy }}
          args:
            - --model-id
            - {{ required "bundledTei.modelId is required" $.Values.bundledTei.modelId | quote }}
            # Explicit: the default (16384) gets the warmup OOM-killed on small CPU nodes.
            - --max-batch-tokens
            - {{ required "bundledTei.maxBatchTokens is required" $.Values.bundledTei.maxBatchTokens | quote }}
          ports:
            - name: http
              containerPort: 80
          {{- with $.Values.bundledTei.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: models
              mountPath: /data
          # /info, not /health: TEI answers /health on the same thread as the embedding batches, so
          # the pod would drop out of the Service while a backfill keeps it busy. /info answers
          # from memory, and TEI only starts listening once the model is loaded and warmed up.
          # The first start downloads the model.
          startupProbe:
            httpGet:
              path: /info
              port: http
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /info
              port: http
            periodSeconds: 10
      volumes:
        # ponytail: re-downloaded on every pod start. A PVC per model if restarts get slow.
        - name: models
          emptyDir:
            sizeLimit: {{ required "bundledTei.cacheSize is required" $.Values.bundledTei.cacheSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "ferret.labels" $ | nindent 4 }}
    app.kubernetes.io/component: tei
spec:
  selector:
    {{- include "ferret.selectorLabels" (dict "root" $ "component" "tei") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
