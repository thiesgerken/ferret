{{- if .Values.ingress.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "ferret.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.ingress.parentRefs | nindent 4 }}
  hostnames:
    - {{ required "ingress.hostname is required when ingress.enabled" .Values.ingress.hostname | quote }}
  # backendRefs spell out the API server's defaults (group, kind, weight): GitOps tools diff the
  # rendered manifest against the live object and would otherwise report the route as out of sync.
  rules:
    - matches:
        - path:
            type: Exact
            value: /graphql
        - path:
            type: Exact
            value: /mcp
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /auth
      backendRefs:
        - group: ""
          kind: Service
          name: {{ .Release.Name }}-server
          port: 8080
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ .Release.Name }}-frontend
          port: 80
          weight: 1
{{- end }}
