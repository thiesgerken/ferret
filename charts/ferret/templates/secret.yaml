{{- if not .Values.secrets.existingSecret }}
{{- $name := include "ferret.secretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- /* Each value is generated once and then read back, so upgrades keep it. */}}
{{- $generated := dict
      "bootstrap-password" (randAlphaNum 24)
      "session-secret" (randAlphaNum 64)
      "worker-secret" (randAlphaNum 64)
      "config-key" (randBytes 32) }}
{{- /* Preserve the bundled password across an external cutover so the kept PVC remains usable. */}}
{{- if or (not (hasKey .Values.postgres "external")) (hasKey $existing "postgres-password") }}
{{- $_ := set $generated "postgres-password" (randAlphaNum 32) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ferret.labels" . | nindent 4 }}
  # Retain credentials so a same-name reinstall can reuse the database.
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key, $value := $generated }}
  {{ $key }}: {{ index $existing $key | default ($value | b64enc) | quote }}
  {{- end }}
{{- end }}
