{{- if not .Values.secrets.existingSecret }}
{{- $name := include "ferret.secretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- /* Each value is generated once and then read back, so upgrades keep it. */}}
{{- $generated := dict
      "postgres-password" (randAlphaNum 32)
      "bootstrap-password" (randAlphaNum 24)
      "session-secret" (randAlphaNum 64)
      "worker-secret" (randAlphaNum 64)
      "config-key" (randBytes 32) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ferret.labels" . | nindent 4 }}
  # Kept with the Postgres PVC, see there.
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key, $value := $generated }}
  {{ $key }}: {{ index $existing $key | default ($value | b64enc) | quote }}
  {{- end }}
{{- end }}
